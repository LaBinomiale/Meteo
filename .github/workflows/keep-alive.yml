name: Keep Streamlit Apps Awake

on:
  schedule:
    # Esegue lo script ogni 4 ore
    - cron: '0 */4 * * *'
  workflow_dispatch: # Ti permette di avviarlo anche a mano per testarlo

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install streamlit-wakeup
        run: |
          pip install streamlit-wakeup

      - name: Run Awake Script
        env:
          URLS: ${{ secrets.URLS }}
        run: |
          # Divide gli URL separati da virgola e li esegue uno per uno
          for url in $(echo $URLS | tr "," "\n"); do
            # Rimuove eventuali spazi bianchi vuoti
            clean_url=$(echo "$url" | xargs)
            if [ -n "$clean_url" ]; then
              echo "Visitando e svegliando: $clean_url"
              # Esegue il comando per svegliare l'app
              streamlit-wakeup "$clean_url" || echo "App già attiva o errore di connessione."
            fi
          done
